name: thermonuclear PR review (informational)

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

# This lane is deliberately separate from ci-gate. It cannot write Checks or
# PR comments, does not check out PR code, and has no model/provider credential.
permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: thermonuclear reviewer policy (not a merge gate)
    if: vars.THERMONUCLEAR_REVIEWER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report blocked informational policy
        uses: FacuVCanale/self-hosted-ci/actions/thermonuclear-review@0000000000000000000000000000000000000000
        with:
          mode: informational
          activation-approved: "false"

# Dedicated CONNECT-only proxy for disposable runners on ci-jit-isolated.
# DNS is resolved by Squid on the trusted host. Destination-IP ACLs are
# evaluated after resolution, which makes private/link-local rebinding fail.
http_port 10.254.0.1:3128
visible_hostname self-hosted-ci-egress

acl runner_net src 10.254.0.0/28
acl CONNECT method CONNECT
acl tls_port port 443
# GitHub's documented runner endpoints for core operation, action downloads,
# artifacts/caches, runner updates, packages, LFS and release assets. Avoid a
# blanket *.githubusercontent.com grant: several of its names are user-owned.
acl github_domains dstdomain .github.com .actions.githubusercontent.com .blob.core.windows.net objects.githubusercontent.com objects-origin.githubusercontent.com github-releases.githubusercontent.com github-registry-files.githubusercontent.com pkg-containers.githubusercontent.com ghcr.io github-cloud.githubusercontent.com github-cloud.s3.amazonaws.com dependabot-actions.githubapp.com release-assets.githubusercontent.com

http_access deny !runner_net
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !github_domains
http_access allow github_domains
http_access deny all

via on
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename none
access_log stdio:/var/log/self-hosted-ci/squid-access.log
cache_log /var/log/self-hosted-ci/squid-cache.log
cache_store_log none
logfile_rotate 0
pinger_enable off

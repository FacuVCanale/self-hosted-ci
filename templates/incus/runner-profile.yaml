config:
  limits.cpu: "2"
  limits.memory: 4GiB
  limits.processes: "2048"
  security.nesting: "false"
  security.idmap.isolated: "true"
  security.privileged: "false"
  security.protection.delete: "false"
description: Disposable one-job runner; destroy after every terminal outcome
devices:
  eth0:
    name: eth0
    network: ci-jit-isolated
    # WSL2 does not expose the nftables bridge family required by Incus L2
    # filters. Isolation remains enforced by the one-instance restricted
    # project, its dedicated bridge, and the host-owned egress policy.
    security.ipv4_filtering: "false"
    security.ipv6_filtering: "false"
    security.mac_filtering: "false"
    type: nic
  root:
    path: /
    pool: ci-jit-dedicated
    size: 12GiB
    type: disk
name: ci-jit

name: reusable ci gate coordinator

on:
  workflow_call:
    inputs:
      gate_service_url: { required: true, type: string }
      oidc_audience: { required: true, type: string }
      runner_pool_id: { required: true, type: string }
      repository_id: { required: true, type: string }
      pr_number: { required: true, type: number }
      head_sha: { required: true, type: string }
      trusted_command:
        description: Fixed trusted-workflow literal; never interpolate PR-controlled data
        required: true
        type: string

jobs:
  acquire:
    name: acquire hosted ci gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      logical_key: ${{ steps.acquire.outputs.logical_key }}
      generation: ${{ steps.acquire.outputs.generation }}
      version: ${{ steps.acquire.outputs.version }}
      state: ${{ steps.acquire.outputs.state }}
      base_sha: ${{ steps.acquire.outputs.base_sha }}
      head_sha: ${{ steps.acquire.outputs.head_sha }}
      merge_policy_version: ${{ steps.acquire.outputs.merge_policy_version }}
      runner_image: ${{ steps.acquire.outputs.runner_image }}
    steps:
      - name: Mint short-lived Gate Service identity
        id: oidc
        shell: bash
        env:
          OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        run: |
          set -euo pipefail
          audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          response="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")"
          token="$(jq -er 'if keys == ["value"] and (.value|type == "string" and length > 0) then .value else error("invalid OIDC response") end' <<<"$response")"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >>"$GITHUB_OUTPUT"

      - name: Prepare Check and acquire hosted gate generation atomically
        id: acquire
        shell: bash
        env:
          URL: ${{ inputs.gate_service_url }}
          POOL: ${{ inputs.runner_pool_id }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg repository_id "$REPOSITORY_ID" --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" '{repository_id:$repository_id,pr_number:$pr_number,head_sha:$head_sha}')"
          response_file="$(mktemp)"; header_file="$(mktemp)"
          trap 'rm -f "$response_file" "$header_file"' EXIT
          status=000
          for attempt in 1 2; do
            : >"$response_file"; : >"$header_file"
            if ! status="$(curl --connect-timeout 5 --max-time 30 -sS -o "$response_file" -D "$header_file" -w '%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$payload" "${URL%/}/v1/pools/${POOL}/gates")"; then
              status=000
            fi
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then break; fi
            retryable=false
            if [[ "$status" == 503 ]] && jq -e '.error == "canonical_pull_request_unavailable"' "$response_file" >/dev/null 2>&1; then
              retryable=true
            fi
            if [[ "$attempt" -eq 2 || "$retryable" != true ]]; then
              cat "$response_file" >&2
              exit 1
            fi
            retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r", "", $2); print $2; exit}' "$header_file")"
            if ! [[ "$retry_after" =~ ^[0-9]+$ ]]; then
              echo "Gate Service returned an invalid Retry-After" >&2
              exit 1
            fi
            if [[ "$retry_after" -gt 180 ]]; then
              echo "Gate Service Retry-After exceeds the acquire job retry budget: ${retry_after}s" >&2
              exit 1
            fi
            sleep "$retry_after"
          done
          response="$(<"$response_file")"
          jq -e '(.logical_key|type == "string" and length > 0) and (.generation|type == "number" and . > 0) and (.version|type == "number" and . > 0) and (.state == "hosted_selected" or .state == "hosted_success" or .state == "hosted_failure") and (.check_run_id|type == "number" and . > 0) and (.base_sha|type == "string" and test("^[0-9a-f]{40}$")) and (.head_sha|type == "string" and test("^[0-9a-f]{40}$")) and (.merge_policy_version == "local-ort-v1") and (.runner_image == "ubuntu-24.04")' <<<"$response" >/dev/null
          printf 'logical_key=%s\n' "$(jq -r '.logical_key' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'generation=%s\n' "$(jq -r '.generation' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(jq -r '.version' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'state=%s\n' "$(jq -r '.state' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$(jq -r '.base_sha' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(jq -r '.head_sha' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'merge_policy_version=%s\n' "$(jq -r '.merge_policy_version' <<<"$response")" >>"$GITHUB_OUTPUT"
          printf 'runner_image=%s\n' "$(jq -r '.runner_image' <<<"$response")" >>"$GITHUB_OUTPUT"

  quality:
    name: hosted quality attempt
    if: needs.acquire.outputs.state == 'hosted_selected'
    needs: acquire
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      merge_base_sha: ${{ steps.merge.outputs.merge_base_sha }}
      tested_tree_sha: ${{ steps.merge.outputs.tested_tree_sha }}
      local_commit_sha: ${{ steps.merge.outputs.local_commit_sha }}
      git_version: ${{ steps.toolchain.outputs.git_version }}
    steps:
      - name: Observe Git toolchain
        id: toolchain
        shell: bash
        env:
          EXPECTED_RUNNER_IMAGE: ${{ needs.acquire.outputs.runner_image }}
        run: |
          set -euo pipefail
          git_version="$(git --version)"
          [[ "$git_version" =~ ^git\ version\ [0-9]+\.[0-9]+\.[0-9]+([.][A-Za-z0-9.-]+)?(\ \(Apple\ Git-[0-9]+\))?$ ]]
          test "$EXPECTED_RUNNER_IMAGE" = ubuntu-24.04
          sentinel="${RUNNER_TEMP}/ci-gate-toolchain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n%s\n' "$git_version" "$EXPECTED_RUNNER_IMAGE" >"$sentinel"
          chmod 0444 "$sentinel"
          sentinel_digest="$(sha256sum "$sentinel" | cut -d' ' -f1)"
          printf 'git_version=%s\nsentinel=%s\nsentinel_digest=%s\n' "$git_version" "$sentinel" "$sentinel_digest" >>"$GITHUB_OUTPUT"
      - name: Check out exact canonical base
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.acquire.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build deterministic local ort merge
        id: merge
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ needs.acquire.outputs.base_sha }}
          HEAD_SHA: ${{ needs.acquire.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_RUNNER_IMAGE: ${{ needs.acquire.outputs.runner_image }}
          EXPECTED_GIT_VERSION: ${{ steps.toolchain.outputs.git_version }}
          TOOLCHAIN_SENTINEL: ${{ steps.toolchain.outputs.sentinel }}
          TOOLCHAIN_SENTINEL_DIGEST: ${{ steps.toolchain.outputs.sentinel_digest }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_ATTR_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          test "$EXPECTED_RUNNER_IMAGE" = ubuntu-24.04
          test -f "$TOOLCHAIN_SENTINEL" && test ! -L "$TOOLCHAIN_SENTINEL" && test -O "$TOOLCHAIN_SENTINEL"
          test "$(sha256sum "$TOOLCHAIN_SENTINEL" | cut -d' ' -f1)" = "$TOOLCHAIN_SENTINEL_DIGEST"
          test "$(sed -n '1p' "$TOOLCHAIN_SENTINEL")" = "$EXPECTED_GIT_VERSION"
          test "$(sed -n '2p' "$TOOLCHAIN_SENTINEL")" = "$EXPECTED_RUNNER_IMAGE"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}"
          git config --local core.hooksPath /dev/null
          git config --local core.attributesFile /dev/null
          git config --local protocol.file.allow never
          git config --local commit.gpgsign false
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/ci-gate/head"
          test "$(git rev-parse refs/ci-gate/head)" = "$HEAD_SHA"
          merge_base_sha="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base_sha"
          git checkout --detach "$BASE_SHA"
          test "$(git --version)" = "$EXPECTED_GIT_VERSION"
          git merge -s ort --no-ff --no-commit "$HEAD_SHA"
          tested_tree_sha="$(git write-tree)"
          local_commit_sha="$(printf '%s\n' 'ci-gate deterministic local ort merge' | GIT_AUTHOR_NAME=ci-gate GIT_AUTHOR_EMAIL=ci-gate@invalid GIT_AUTHOR_DATE='1970-01-01T00:00:00Z' GIT_COMMITTER_NAME=ci-gate GIT_COMMITTER_EMAIL=ci-gate@invalid GIT_COMMITTER_DATE='1970-01-01T00:00:00Z' git commit-tree "$tested_tree_sha" -p "$BASE_SHA" -p "$HEAD_SHA")"
          git reset --hard "$local_commit_sha"
          test "$(git rev-parse HEAD^{tree})" = "$tested_tree_sha"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          printf 'merge_base_sha=%s\ntested_tree_sha=%s\nlocal_commit_sha=%s\n' "$merge_base_sha" "$tested_tree_sha" "$local_commit_sha" >>"$GITHUB_OUTPUT"
      - name: Execute trusted CI command
        id: execute
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CI_GATE_TRUSTED_COMMAND: ${{ inputs.trusted_command }}
        run: |
          set -euo pipefail
          bash --noprofile --norc -euo pipefail -c "$CI_GATE_TRUSTED_COMMAND"
      - name: Report quality result
        id: result
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          EXECUTE: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          conclusion=failure
          if [[ "$CHECKOUT" == success && "$MERGE" == success && "$EXECUTE" == success ]]; then conclusion=success; fi
          printf 'conclusion=%s\n' "$conclusion" >>"$GITHUB_OUTPUT"
          test "$conclusion" = success

  finalize:
    name: finalize hosted ci gate
    if: always() && needs.acquire.result == 'success'
    needs: [acquire, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Mint fresh transition identity
        if: needs.acquire.outputs.state == 'hosted_selected'
        id: oidc
        shell: bash
        env:
          OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        run: |
          set -euo pipefail
          audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          response="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")"
          token="$(jq -er 'if keys == ["value"] and (.value|type == "string" and length > 0) then .value else error("invalid OIDC response") end' <<<"$response")"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >>"$GITHUB_OUTPUT"
      - name: Commit terminal gate evidence
        if: needs.acquire.outputs.state == 'hosted_selected'
        shell: bash
        env:
          URL: ${{ inputs.gate_service_url }}
          POOL: ${{ inputs.runner_pool_id }}
          LOGICAL_KEY: ${{ needs.acquire.outputs.logical_key }}
          GENERATION: ${{ needs.acquire.outputs.generation }}
          VERSION: ${{ needs.acquire.outputs.version }}
          BASE_SHA: ${{ needs.acquire.outputs.base_sha }}
          HEAD_SHA: ${{ needs.acquire.outputs.head_sha }}
          MERGE_POLICY_VERSION: ${{ needs.acquire.outputs.merge_policy_version }}
          GIT_VERSION: ${{ needs.quality.outputs.git_version }}
          RUNNER_IMAGE: ${{ needs.acquire.outputs.runner_image }}
          MERGE_BASE_SHA: ${{ needs.quality.outputs.merge_base_sha }}
          TESTED_TREE_SHA: ${{ needs.quality.outputs.tested_tree_sha }}
          LOCAL_COMMIT_SHA: ${{ needs.quality.outputs.local_commit_sha }}
          TRUSTED_COMMAND: ${{ inputs.trusted_command }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          QUALITY_CONCLUSION: ${{ needs.quality.outputs.conclusion }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          conclusion=failure; to_state=hosted_failure
          if [[ "$QUALITY_RESULT" == success && "$QUALITY_CONCLUSION" == success ]]; then conclusion=success; to_state=hosted_success; fi
          zero_sha="$(printf '%040d' 0)"
          merge_base_sha="${MERGE_BASE_SHA:-$zero_sha}"
          tested_tree_sha="${TESTED_TREE_SHA:-$zero_sha}"
          local_commit_sha="${LOCAL_COMMIT_SHA:-$zero_sha}"
          command_digest="$(printf '%s' "$TRUSTED_COMMAND" | sha256sum | cut -d' ' -f1)"
          evidence_digest="$(printf '%s\n' ci-gate-local-ort-evidence-v1 "$LOGICAL_KEY" "$GENERATION" "$BASE_SHA" "$HEAD_SHA" "$MERGE_POLICY_VERSION" "$GIT_VERSION" "$RUNNER_IMAGE" "$merge_base_sha" "$tested_tree_sha" "$local_commit_sha" "$command_digest" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$conclusion" | sha256sum | cut -d' ' -f1)"
          payload="$(jq -cn --arg logical_key "$LOGICAL_KEY" --argjson generation "$GENERATION" --argjson expected_version "$VERSION" --arg to_state "$to_state" --arg evidence_digest "$evidence_digest" --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" --arg merge_policy_version "$MERGE_POLICY_VERSION" --arg git_version "$GIT_VERSION" --arg runner_image "$RUNNER_IMAGE" --arg merge_base_sha "$merge_base_sha" --arg tested_tree_sha "$tested_tree_sha" --arg local_commit_sha "$local_commit_sha" --arg command_digest "$command_digest" '{logical_key:$logical_key,generation:$generation,expected_version:$expected_version,from_state:"hosted_selected",to_state:$to_state,evidence_digest:$evidence_digest,base_sha:$base_sha,head_sha:$head_sha,merge_policy_version:$merge_policy_version,git_version:$git_version,runner_image:$runner_image,merge_base_sha:$merge_base_sha,tested_tree_sha:$tested_tree_sha,local_commit_sha:$local_commit_sha,command_digest:$command_digest}')"
          curl -fsS -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$payload" "${URL%/}/v1/pools/${POOL}/gates/transition" >/dev/null
          test "$conclusion" = success
      - name: Reconcile previously terminal gate
        if: needs.acquire.outputs.state != 'hosted_selected'
        shell: bash
        env:
          TERMINAL_STATE: ${{ needs.acquire.outputs.state }}
        run: test "$TERMINAL_STATE" = hosted_success

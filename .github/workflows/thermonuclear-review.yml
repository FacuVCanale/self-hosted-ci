name: thermonuclear review (informational only)

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:
    inputs:
      app_id:
        description: Dedicated Thermonuclear GitHub App id.
        required: true
        type: string
      expected_app_id:
        description: Independently configured exact App id.
        required: true
        type: string
      installation_id:
        description: Selected-repository App installation id.
        required: true
        type: string
      repository:
        description: Exact repository identity from the trusted caller event or manual reconciliation input.
        required: true
        type: string
      pr_number:
        description: Exact pull request number from the trusted caller event or manual reconciliation input.
        required: true
        type: string
      base_sha:
        description: Exact canonical base SHA from the trusted caller event or manual reconciliation input.
        required: true
        type: string
      head_sha:
        description: Exact canonical head SHA from the trusted caller event or manual reconciliation input.
        required: true
        type: string
    secrets:
      THERMONUCLEAR_APP_PRIVATE_KEY:
        description: Dedicated GitHub App PKCS#8 private key.
        required: true
      THERMONUCLEAR_OPENAI_API_KEY:
        description: Project-scoped OpenAI API key.
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: thermonuclear-${{ github.repository_id }}-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: thermonuclear informational comment (never a gate)
    if: >-
      vars.THERMONUCLEAR_REVIEWER_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load exact trusted reviewer implementation
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_REPOSITORY"
          test -n "$WORKFLOW_SHA"
          case "$WORKFLOW_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#WORKFLOW_SHA}" -eq 40
          root="$RUNNER_TEMP/thermonuclear-reviewer"
          mkdir -p "$root/actions/thermonuclear-review" "$root/github_automation"
          for path in \
            actions/thermonuclear-review/run.py \
            actions/thermonuclear-review/policy-v1.md \
            actions/thermonuclear-review/provenance-v1.json \
            github_automation/hosted_reviewer.py \
            github_automation/hosted_reviewer_api.py
          do
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 30 \
              "https://raw.githubusercontent.com/${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}/${path}" \
              --output "$root/$path"
          done
          printf 'REVIEWER_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Review canonical API diff and upsert App-owned comment
        shell: bash
        env:
          THERMONUCLEAR_ENABLED: "true"
          THERMONUCLEAR_REPOSITORY: ${{ inputs.repository || github.repository }}
          THERMONUCLEAR_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          THERMONUCLEAR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          THERMONUCLEAR_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          THERMONUCLEAR_APP_ID: ${{ inputs.app_id || vars.THERMONUCLEAR_APP_ID }}
          THERMONUCLEAR_EXPECTED_APP_ID: ${{ inputs.expected_app_id || vars.THERMONUCLEAR_EXPECTED_APP_ID }}
          THERMONUCLEAR_INSTALLATION_ID: ${{ inputs.installation_id || vars.THERMONUCLEAR_INSTALLATION_ID }}
          THERMONUCLEAR_APP_PRIVATE_KEY: ${{ secrets.THERMONUCLEAR_APP_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.THERMONUCLEAR_OPENAI_API_KEY }}
          THERMONUCLEAR_MODEL: gpt-5.6-terra
        run: python "$REVIEWER_ROOT/actions/thermonuclear-review/run.py"

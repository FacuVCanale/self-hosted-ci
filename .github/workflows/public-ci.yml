name: public source validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: make setup

      - name: Run tests and public-distribution validation
        run: |
          make test
          make validate
          make distribution-check

      - name: Set up Node.js for Gate Service validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gate-service/package-lock.json

      - name: Install Gate Service dependencies
        working-directory: gate-service
        run: npm ci

      - name: Validate hosted-only Gate Service
        working-directory: gate-service
        run: npm run check

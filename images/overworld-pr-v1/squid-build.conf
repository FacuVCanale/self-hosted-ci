# Temporary, build-only egress policy. The image builder restores the signed
# GitHub-only policy byte-for-byte before it releases its transaction lock.
http_port 10.254.0.1:3128
visible_hostname self-hosted-ci-egress
acl runner_net src 10.254.0.0/28
acl CONNECT method CONNECT
acl tls_port port 443
acl build_domains dstdomain archive.ubuntu.com security.ubuntu.com apt-archive.postgresql.org www.postgresql.org github.com objects.githubusercontent.com release-assets.githubusercontent.com registry.npmjs.org pypi.org files.pythonhosted.org dl.min.io cdn.playwright.dev playwright.download.prss.microsoft.com
http_access deny !runner_net
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !build_domains
http_access allow build_domains
http_access deny all
via on
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename none
access_log stdio:/var/log/self-hosted-ci/squid-access.log
cache_log /var/log/self-hosted-ci/squid-cache.log
cache_store_log none
logfile_rotate 0
pinger_enable off

# Isolated build-only proxy. It listens on a distinct port and never replaces
# the signed production GitHub-only proxy policy.
http_port 10.254.0.1:8079
visible_hostname self-hosted-ci-build-egress
acl runner_net src 10.254.0.0/28
acl CONNECT method CONNECT
acl tls_port port 443
acl build_domains dstdomain archive.ubuntu.com security.ubuntu.com apt-archive.postgresql.org www.postgresql.org nodejs.org github.com objects.githubusercontent.com release-assets.githubusercontent.com registry.npmjs.org pypi.org files.pythonhosted.org dl.min.io storage.googleapis.com
http_access deny !runner_net
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !build_domains
http_access allow build_domains
http_access deny all
via on
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename none
access_log none
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0
pinger_enable off
